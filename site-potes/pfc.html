<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pierre, feuille, ciseaux — LE QG</title>
  <meta name="description" content="Le classique contre l'ordinateur. Premier à cinq points.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>Pierre, feuille, ciseaux</h1>
      <p>Le classique contre l'ordinateur. Premier à cinq points.</p>
    </div>
    <div class="pfc">
      <div class="pfc-side"><div class="pfc-face" id="you"></div><p class="pfc-name">Toi</p><p class="pfc-move" id="yourmove">?</p><p class="pfc-score" id="score-you">0</p></div>
      <div class="pfc-side"><div class="pfc-face" id="cpu"></div><p class="pfc-name">Ordinateur</p><p class="pfc-move" id="cpumove">?</p><p class="pfc-score" id="score-cpu">0</p></div>
    </div>
    <p class="p4-status" id="status"></p>
    <div class="btn-row" style="justify-content:center">
      <button class="btn pfc-btn" data-move="pierre" type="button">✊ Pierre</button>
      <button class="btn pfc-btn" data-move="feuille" type="button">✋ Feuille</button>
      <button class="btn pfc-btn" data-move="ciseaux" type="button">✌️ Ciseaux</button>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn btn-secondary hidden" id="restart" type="button">Rejouer</button><button class="btn btn-secondary btn-small" id="sound" type="button">Son : activé</button></div>
  </main>
  <script type="module" src="js/games/pfc.js"></script>
</body>
</html>
