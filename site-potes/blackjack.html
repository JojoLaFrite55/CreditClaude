<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack des potes — LE QG</title>
  <meta name="description" content="Approche-toi de 21 sans le dépasser. Jetons fictifs, aucun vrai argent.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
  <link rel="stylesheet" href="css/jeux2.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>Blackjack des potes</h1>
      <p>Approche-toi de 21 sans le dépasser. Jetons fictifs, aucun vrai argent.</p>
    </div>
    <div class="bj">
      <div class="zq-top"><div class="hud-item light"><span>Jetons</span><strong id="credits">200</strong></div><div class="hud-item light"><span>Mise</span><strong id="bet">10</strong></div><div class="hud-item light"><span>Record</span><strong id="best">200</strong></div><button class="hud-btn dark-btn" id="sound" type="button">Son : activé</button></div>
      <div class="bj-row"><div class="who"><span id="dealer-face"></span>Banque</div><div class="bj-hand" id="dealer"></div><div class="bj-total" id="dealer-total"></div></div>
      <div class="bj-row"><div class="who"><span id="player-face"></span>Toi</div><div class="bj-hand" id="player"></div><div class="bj-total" id="player-total"></div></div>
      <p class="p4-status" id="status">Choisis ta mise puis distribue.</p>
      <div class="btn-row" style="justify-content:center"><button class="btn btn-secondary" id="minus" type="button">Mise −</button><button class="btn btn-secondary" id="plus" type="button">Mise +</button><button class="btn" id="deal" type="button">Distribuer</button></div>
      <div class="btn-row" style="justify-content:center"><button class="btn" id="hit" type="button">Carte</button><button class="btn" id="stand" type="button">Rester</button><button class="btn btn-secondary" id="double" type="button">Doubler</button></div>
    </div>
  </main>
  <script type="module" src="js/games/blackjack.js"></script>
</body>
</html>
