<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine à sous — LE QG</title>
  <meta name="description" content="Trois têtes, des jetons de mauvaise foi, aucun vrai argent.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
  <link rel="stylesheet" href="css/jeux2.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>Machine à sous</h1>
      <p>Trois têtes, des jetons de mauvaise foi, aucun vrai argent.</p>
    </div>
    <div class="arcade-shell">
      <canvas id="cv" aria-label="Zone de jeu"></canvas>
      <div class="arcade-bar">
        <div class="hud-item"><span>Jetons</span><strong id="credits">200</strong></div><div class="hud-item"><span>Mise</span><strong id="bet">10</strong></div><div class="hud-item"><span>Record</span><strong id="best">200</strong></div>
        <button class="hud-btn" id="minus" type="button">Mise −</button><button class="hud-btn" id="plus" type="button">Mise +</button><button class="hud-btn" id="spin" type="button">Lancer</button>
        <button class="hud-btn" id="sound" type="button">Son : activé</button>
      </div>
      <div class="overlay" id="ov">
        <div class="panel">
          <p class="eyebrow" data-ov-eyebrow></p>
          <h2 data-ov-title></h2>
          <p class="muted" data-ov-text></p>
          <div data-ov-stats></div>
          <div class="panel-actions stack">
            <button class="btn" data-ov-action type="button">Jouer</button>
            <a class="btn btn-secondary" href="jeux.html">Retour aux jeux</a>
          </div>
        </div>
      </div>
    </div>
    <p class="muted" style="text-align:center;margin-top:14px">Trois têtes identiques : gros gain. Deux côte à côte : ta mise doublée. Aucun vrai argent, juste de la mauvaise foi.</p>
  </main>
  <script type="module" src="js/games/slots.js"></script>
</body>
</html>
