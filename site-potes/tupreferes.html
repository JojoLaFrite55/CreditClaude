<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu préfères ? — LE QG</title>
  <meta name="description" content="Deux choix, aucun bon. Discutez-en jusqu'au bout de la nuit.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
</head>
<body data-page="outils">
  <main class="wrap arcade-page page-tool">
    <div class="page-head arcade-head">
      <h1>Tu préfères ?</h1>
      <p>Deux choix, aucun bon. Discutez-en jusqu'au bout de la nuit.</p>
    </div>
    <div class="choices">
      <button class="choice" id="a" type="button"></button>
      <span class="choice-or">OU</span>
      <button class="choice" id="b" type="button"></button>
    </div>
    <p class="muted" id="note" style="text-align:center;margin-top:18px;min-height:3em"></p>
    <div class="btn-row" style="justify-content:center"><button class="btn hidden" id="next" type="button">Question suivante</button><button class="btn btn-secondary btn-small" id="sound" type="button">Son : activé</button></div>
    <p class="muted" id="stats" style="text-align:center;margin-top:16px"></p>
  </main>
  <script type="module" src="js/tools/tupreferes.js"></script>
</body>
</html>
