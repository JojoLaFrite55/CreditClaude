<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les cinq erreurs — LE QG</title>
  <meta name="description" content="Deux photos presque identiques : trouve les cinq différences avant la fin du temps.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
  <link rel="stylesheet" href="css/jeux2.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>Les cinq erreurs</h1>
      <p>Deux photos presque identiques : trouve les cinq différences avant la fin du temps.</p>
    </div>
    <div class="er" id="er">
      <div class="zq-top"><div class="hud-item light"><span>Manche</span><strong id="round">1</strong></div><div class="hud-item light"><span>Trouvées</span><strong id="found">0/5</strong></div><div class="hud-item light"><span>Temps</span><strong id="time">75</strong></div><div class="hud-item light"><span>Record</span><strong id="best">0</strong></div></div>
      <div class="er-boards"><canvas id="a" width="480" height="480" aria-label="Photo originale"></canvas><canvas id="b" width="480" height="480" aria-label="Photo modifiée"></canvas></div>
      <p class="p4-status" id="status">Appuie sur Jouer.</p>
      <div class="btn-row" style="justify-content:center"><button class="btn" id="start" type="button">Jouer</button></div>
    </div>
  </main>
  <script type="module" src="js/games/erreurs.js"></script>
</body>
</html>
