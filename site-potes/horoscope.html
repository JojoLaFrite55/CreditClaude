<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="outils">
  <main class="wrap arcade-page page-tool">
    <div class="page-head arcade-head">
      <h1>Horoscope des potes</h1>

        <div class="field"><label for="sign">Ton signe</label><select id="sign"></select></div>

        <p class="muted">Le même signe donne le même horoscope pour une même date : tout le monde peut comparer.</p>

      <div class="horo-card" id="card"></div>
    </div>
  </main>
  <script type="module" src="js/tools/horoscope.js"></script>
