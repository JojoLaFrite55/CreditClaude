<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom tête — LE QG</title>
  <meta name="description" content="Un détail agrandi d'une tête : retrouve laquelle c'est avant la fin du chrono.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
  <link rel="stylesheet" href="css/jeux2.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>Zoom tête</h1>
      <p>Un détail agrandi d'une tête : retrouve laquelle c'est avant la fin du chrono.</p>
    </div>
    <div class="zq" id="quiz">
      <div class="zq-top"><div class="hud-item light"><span>Manche</span><strong id="round">1/10</strong></div><div class="hud-item light"><span>Score</span><strong id="score">0</strong></div><div class="hud-item light"><span>Série</span><strong id="streak">0</strong></div><div class="hud-item light"><span>Record</span><strong id="best">0</strong></div></div>
      <div class="zq-timer"><i id="timer"></i></div>
      <canvas id="zoom" width="480" height="480" aria-label="Détail agrandi"></canvas>
      <div class="zq-opts" id="opts"></div>
      <p class="p4-status" id="status">Appuie sur Jouer.</p>
      <div class="btn-row" style="justify-content:center"><button class="btn" id="start" type="button">Jouer</button></div>
    </div>
  </main>
  <script type="module" src="js/games/zoomtete.js"></script>
</body>
</html>
