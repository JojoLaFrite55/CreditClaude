<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeux — LE QG</title>
  <meta name="description" content="Les jeux du QG.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body data-page="jeux">
  <main class="wrap">
    <div class="page-head">
      <h1>Jeux</h1>
      <p>Les jeux du QG. Gratuits, sans pub, jouables directement dans le navigateur. Les records sont gardés sur ton appareil.</p>
    </div>
    <div class="grid" id="games"></div>
  </main>
  <script type="module">
    import "./js/layout.js";
    import { GAMES } from "./js/data.js";

    const root = document.getElementById("games");

    const make = (item) => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = item.href;
      card.innerHTML = `
        <div class="media">
          ${item.badge ? `<span class="badge">${item.badge}</span>` : ""}
          <img src="${item.image}" alt="Aperçu : ${item.title}" loading="lazy" onerror="this.remove()">
        </div>
        <h3>${item.title}</h3>
        <p class="muted">${item.text}</p>
        <div class="tags">${item.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>`;
      return card;
    };

    GAMES.forEach((game) => root.append(make(game)));

  </script>
</body>
</html>
