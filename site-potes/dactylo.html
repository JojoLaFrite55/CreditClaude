<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dactylo des potes — LE QG</title>
  <meta name="description" content="Recopie trois phrases absurdes le plus vite possible, sans te tromper.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
  <link rel="stylesheet" href="css/jeux2.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>Dactylo des potes</h1>
      <p>Recopie trois phrases absurdes le plus vite possible, sans te tromper.</p>
    </div>
    <div class="typing">
      <div class="zq-top"><div class="hud-item light"><span>Temps</span><strong id="time">0.0</strong></div><div class="hud-item light"><span>Mots/min</span><strong id="wpm">0</strong></div><div class="hud-item light"><span>Précision</span><strong id="acc">100 %</strong></div><div class="hud-item light"><span>Record</span><strong id="best">0</strong></div><button class="hud-btn dark-btn" id="sound" type="button">Son : activé</button></div>
      <div class="typing-text" id="text"></div>
      <input type="text" id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Zone de saisie">
      <p class="p4-status" id="status"></p>
      <div class="btn-row" style="justify-content:center"><button class="btn" id="start" type="button">Commencer</button></div>
    </div>
  </main>
  <script type="module" src="js/games/dactylo.js"></script>
</body>
</html>
