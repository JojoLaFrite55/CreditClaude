<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 des potes — LE QG</title>
  <meta name="description" content="Fusionne les têtes identiques jusqu'à la tête ultime.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
</head>
<body data-page="jeux">
  <main class="wrap arcade-page">
    <div class="page-head arcade-head">
      <h1>2048 des potes</h1>
      <p>Fusionne les têtes identiques jusqu'à la tête ultime.</p>
    </div>
    <div class="g2048-wrap">
      <div class="memory-bar">
        <div class="hud-item light"><span>Score</span><strong id="score">0</strong></div>
        <div class="hud-item light"><span>Record</span><strong id="best">0</strong></div>
        <button class="btn btn-small btn-secondary" id="restart" type="button" style="margin-left:auto">Nouvelle partie</button>
        <button class="hud-btn dark-btn" id="sound" type="button">Son : activé</button>
      </div>
      <div class="g2048" id="grid2048">
        <div class="g2048-cells"></div>
        <div class="g2048-tiles" id="tiles"></div>
        <div class="g2048-message hidden" id="message"></div>
      </div>
    </div>
    <p class="muted" style="text-align:center;margin-top:14px">Flèches, ZQSD ou glisse le doigt.</p>
  </main>
  <script type="module" src="js/games/deuxmille.js"></script>
</body>
</html>
