<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minuteur et chrono — LE QG</title>
  <meta name="description" content="Un minuteur avec alarme et un chronomètre avec tours, pour les défis et les jeux de la soirée.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/memes.css">
</head>
<body data-page="outils">
  <main class="wrap arcade-page page-tool">
    <div class="page-head arcade-head">
      <h1>Minuteur et chrono</h1>
      <p>Un minuteur avec alarme et un chronomètre avec tours, pour les défis et les jeux de la soirée.</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="timer" aria-selected="true">Minuteur</button>
      <button class="tab" type="button" role="tab" data-tab="chrono" aria-selected="false">Chronomètre</button>
      <button class="btn btn-small btn-secondary" id="sound" type="button" style="margin-left:auto">Son : activé</button>
    </div>
    <section data-panel="timer" class="tool-panel" style="max-width:560px">
      <p class="clock" id="tdisplay">01:00</p>
      <div class="btn-row">
        <label class="field"><span>Minutes</span><input type="text" id="mm" value="1" inputmode="numeric" style="width:90px"></label>
        <label class="field"><span>Secondes</span><input type="text" id="ss" value="0" inputmode="numeric" style="width:90px"></label>
      </div>
      <div class="btn-row"><button class="btn btn-small btn-secondary" data-sec="30" type="button">30 s</button><button class="btn btn-small btn-secondary" data-sec="60" type="button">1 min</button><button class="btn btn-small btn-secondary" data-sec="180" type="button">3 min</button><button class="btn btn-small btn-secondary" data-sec="300" type="button">5 min</button><button class="btn btn-small btn-secondary" data-sec="600" type="button">10 min</button></div>
      <div class="btn-row"><button class="btn" id="tstart" type="button">Démarrer</button><button class="btn btn-secondary" id="treset" type="button">Réinitialiser</button></div>
    </section>
    <section data-panel="chrono" class="tool-panel hidden" style="max-width:560px">
      <p class="clock" id="cdisplay">00:00.0</p>
      <div class="btn-row"><button class="btn" id="cstart" type="button">Démarrer</button><button class="btn btn-secondary" id="clap" type="button">Tour</button><button class="btn btn-secondary" id="creset" type="button">Réinitialiser</button></div>
      <ul class="history laps" id="laps"></ul>
    </section>
  </main>
  <script type="module" src="js/tools/minuteur.js"></script>
</body>
</html>
